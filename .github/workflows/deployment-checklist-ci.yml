name: Deployment Checklist CI

on:
  push:
    paths:
      - 'Milestone 08/The Deployment Checklist/**'
      - '.github/workflows/deployment-checklist-ci.yml'
  pull_request:
    paths:
      - 'Milestone 08/The Deployment Checklist/**'
      - '.github/workflows/deployment-checklist-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: |
            Milestone 08/The Deployment Checklist/backend/package-lock.json
            Milestone 08/The Deployment Checklist/frontend/package-lock.json
      - name: Install backend dependencies and generate Prisma Client
        run: npm ci
        working-directory: ./Milestone 08/The Deployment Checklist/backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./Milestone 08/The Deployment Checklist/frontend
      - name: Build frontend
        run: npm run build
        working-directory: ./Milestone 08/The Deployment Checklist/frontend
