services:
  - type: web
    name: launchpad-api
    runtime: node
    rootDir: Milestone 08/The Deployment Checklist/backend
    buildCommand: npm install && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  - type: static
    name: launchpad-frontend
    rootDir: Milestone 08/The Deployment Checklist/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
